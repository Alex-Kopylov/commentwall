[package]
name = "commentwall"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Fail Python files that contain walls of standalone comments"
license = "MIT"
repository = "https://github.com/Alex-Kopylov/commentwall"
readme = "README.md"
keywords = ["python", "lint", "comments", "pre-commit"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# full-lexer is required: without it the lexer drops Tok::Comment entirely.
# Defaults are off to keep the malachite bignum tree out; a bigint backend is
# still mandatory to compile the AST, and num-bigint is the smaller one.
rustpython-parser = { version = "0.4.0", default-features = false, features = [
    "full-lexer",
    "num-bigint",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
